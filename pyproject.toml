[project]
name = "ytmp3"
version = "0.1.0"
description = "Searchable YouTube -> MP3 downloader that prefers audio uploads and trims non-music intros"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.79",
    "yt-dlp>=2024.1.1",
    "yt-dlp-ejs>=0.8.0",
]

[project.scripts]
ytmp3 = "ytmp3.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytmp3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not network'"
markers = [
    "network: hits the real network via yt-dlp (deselected by default)",
]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
